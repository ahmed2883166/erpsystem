name: NEXUS ERP tests

on:
  push:
    branches:
      - feature/company-setup-currency-tax-activity
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Static analysis (unused imports and variables)
        run: ruff check app.py accounting_core.py stock.py sales.py purchases.py party_reports.py financial_planning.py tests --select F401,F841 --output-format=github
      - name: Run unit and integration tests
        run: python run_tests.py
