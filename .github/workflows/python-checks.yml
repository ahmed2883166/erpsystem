name: Python checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/company-setup-currency-tax-activity, work/phase7-bootstrap-ux]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip -r requirements.txt
      - run: python -m compileall -q app.py stock.py purchases.py sales.py banking.py accounting_core.py chart_templates.py tax_center.py workforce.py currency_center.py party_reports.py licensing.py
      - run: python run_tests.py
