name: Python checks
on:
  push:
    branches: [main, feature/company-setup-currency-tax-activity]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip Flask
      - run: python -m compileall -q app.py stock.py purchases.py sales.py banking.py accounting_core.py chart_templates.py tax_center.py workforce.py currency_center.py
      - run: python -m unittest discover -s tests -v
