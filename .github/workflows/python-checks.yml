name: Python checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/company-setup-currency-tax-activity, work/phase7-bootstrap-ux]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_TEST_POSTGRES_DSN: postgresql://nexus_test:nexus_test@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and PostgreSQL 16 client tools
        run: |
tool_dir="$RUNNER_TEMP/postgres16-tools"
          mkdir -p "$tool_dir"
          for tool in pg_dump pg_restore; do
            cat > "$tool_dir/$tool" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -e PGSSLMODE -e PGSSLROOTCERT -e PGSSLCERT -e PGSSLKEY \
            -e PGCONNECT_TIMEOUT -e PGAPPNAME -e PGOPTIONS \
            -v /tmp:/tmp \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" postgres:16 "$tool" "$@"
          EOF
            chmod +x "$tool_dir/$tool"
          done
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/pg_dump" --version
          "$tool_dir/pg_restore" --version
          python -m pip install --upgrade pip -r requirements.txt
      - run: python -m compileall -q app.py stock.py purchases.py sales.py banking.py accounting_core.py chart_templates.py tax_center.py workforce.py currency_center.py party_reports.py licensing.py
      - run: python run_tests.py
