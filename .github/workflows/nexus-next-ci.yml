name: Admrail ERP v2 CI

on:
  push:
    branches:
      - work/nexus-django-react-rebuild
      - fix/audit-performance-and-owner-toolkit-2026-11
  pull_request:
    branches:
      - work/nexus-django-react-rebuild

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus_app
          POSTGRES_PASSWORD: nexus_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_app -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: nexus_next/backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: nexus_test
      POSTGRES_USER: nexus_app
      POSTGRES_PASSWORD: nexus_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus_next/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Enforce high-signal Ruff checks
        run: ruff check . --select F841,F401,F811,BLE001,B023,B904 --output-format concise
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run core accounts companies accounting customers inventory suppliers purchasing sales treasury assets audit approvals hr
      - run: python manage.py migrate --noinput
      - name: Seed and verify required reference currencies
        run: |
          python manage.py seed_reference_data
          python manage.py shell -c "from companies.models import Currency; expected={'EGP','SAR','USD','EUR'}; actual=set(Currency.objects.filter(code__in=expected, is_active=True).values_list('code', flat=True)); assert actual == expected, f'Missing active currencies: {expected - actual}'; print('All four default currencies are available.')"
      - name: Run HR payroll and employee regression tests explicitly
        run: python manage.py test hr --verbosity 2
      - name: Run complete backend test suite
        run: python manage.py test --verbosity 2


  postgres-backup-roundtrip:
    name: PostgreSQL backup and isolated restore integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_backup_test
          POSTGRES_USER: nexus_backup_test
          POSTGRES_PASSWORD: isolated_backup_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_backup_test -d nexus_backup_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_TEST_POSTGRES_DSN: postgresql://nexus_backup_test:isolated_backup_test_password@127.0.0.1:5432/nexus_backup_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL 16 client tools and isolated test dependencies
        run: |
          docker info >/dev/null
          tool_dir="$RUNNER_TEMP/postgres16-tools"
          mkdir -p "$tool_dir"
          for tool in pg_dump pg_restore; do
            cat > "$tool_dir/$tool" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -e PGSSLMODE -e PGSSLROOTCERT -e PGSSLCERT -e PGSSLKEY \
            -e PGCONNECT_TIMEOUT -e PGAPPNAME -e PGOPTIONS \
            -v /tmp:/tmp \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" postgres:16 "$tool" "$@"
          EOF
            chmod +x "$tool_dir/$tool"
          done
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/pg_dump" --version
          "$tool_dir/pg_restore" --version
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary,pool]>=3.2,<4"
      - name: Run real pg_dump and pg_restore round-trip
        run: python -m unittest discover -s tests -p 'test_postgres_backup.py' -v

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: nexus_next/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and commit the npm lockfile on branch pushes
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock frontend npm dependency tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - run: npm ls --depth=0
      - run: npm run typecheck
      - run: npm run build

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Windows DPAPI backup key protection
        shell: pwsh
        working-directory: nexus_next/backend
        run: |
          python -m pip install "cryptography==46.0.7"
          if ($LASTEXITCODE -ne 0) { throw "Cryptography dependency installation failed." }
          python -c "import os; from core.backup_key import protect_machine_key, unprotect_machine_key; key=os.urandom(32); protected=protect_machine_key(key); assert protected != key; assert unprotect_machine_key(protected) == key; print('Windows DPAPI backup key round-trip passed.')"
          if ($LASTEXITCODE -ne 0) { throw "Windows DPAPI backup key verification failed." }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build React assets for portable runtime
        working-directory: nexus_next/frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "React production build failed." }
      - name: Parse Windows operational scripts
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem nexus_next/scripts/*.ps1
            Get-Item nexus_next/start-local.ps1
            Get-Item nexus_next/start-production.ps1
            Get-Item nexus_next/setup-admrail.ps1
            Get-Item nexus_next/run-admrail-lan.ps1
            Get-Item nexus_next/start-production.ps1
            Get-Item nexus_next/configure-admrail-lan.ps1
            Get-Item nexus_next/Admrail-Owner-Toolkit/Admrail-Owner-Toolkit.ps1
            Get-Item nexus_next/scripts/Remove-Old-Admrail-Database.ps1
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Guard temporary plaintext backup cleanup
        shell: pwsh
        run: |
          $backupScript = Get-Content nexus_next/scripts/backup-postgres.ps1 -Raw
          if ($backupScript -notmatch '(?s)finally\s*\{.*Test-Path\s+-LiteralPath\s+\$DailyFile.*Remove-Item\s+-LiteralPath\s+\$DailyFile\s+-Force') {
            throw "The scheduled backup script must remove its temporary plaintext dump in a finally block."
          }
      - name: Build Windows trial package
        shell: pwsh
        run: ./nexus_next/scripts/package-trial.ps1 -OutputDirectory "$env:RUNNER_TEMP/nexus-trial"
      - name: Upload Windows trial package
        uses: actions/upload-artifact@v4
        with:
          name: Admrail-ERP-v2-Trial-Windows
          path: ${{ runner.temp }}/nexus-trial/*
          if-no-files-found: error
          retention-days: 14
      - name: Build embedded Python Windows package
        shell: pwsh
        run: ./nexus_next/scripts/package-portable-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/nexus-portable"
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Admrail-ERP-v2-Portable-Windows
          path: ${{ runner.temp }}/nexus-portable/*
          if-no-files-found: error
          retention-days: 14
