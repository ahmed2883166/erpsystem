name: NEXUS Next CI

on:
  push:
    branches:
      - work/nexus-django-react-rebuild
  pull_request:
    branches:
      - work/nexus-django-react-rebuild

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus_app
          POSTGRES_PASSWORD: nexus_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_app -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: nexus_next/backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: nexus_test
      POSTGRES_USER: nexus_app
      POSTGRES_PASSWORD: nexus_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus_next/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run accounts companies accounting customers inventory
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus_next/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
