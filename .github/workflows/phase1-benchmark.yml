name: NEXUS Phase 1 Benchmark

on:
  push:
    branches:
      - feature/company-setup-currency-tax-activity
    paths:
      - "management_dashboard.py"
      - "accounting_core.py"
      - "scripts/benchmark_phase1.py"
      - ".github/workflows/phase1-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run isolated 100k journal benchmark
        run: python scripts/benchmark_phase1.py --entries 100000
