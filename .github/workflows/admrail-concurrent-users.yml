name: Admrail Concurrent Users Benchmark
on:
  push:
    branches:
      - work/nexus-django-react-rebuild
    paths:
      - "nexus_next/backend/scripts/benchmark_concurrent_users.py"
      - "nexus_next/backend/accounting/api.py"
      - ".github/workflows/admrail-concurrent-users.yml"
  workflow_dispatch:
concurrency:
  group: admrail-concurrent-users-benchmark
  cancel-in-progress: true
jobs:
  concurrent-users:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: admrail_benchmark
          POSTGRES_USER: admrail_benchmark
          POSTGRES_PASSWORD: benchmark_only_password
        ports:
          - 5432:5432
        options: >-
          --shm-size=1gb
          --health-cmd "pg_isready -U admrail_benchmark -d admrail_benchmark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: nexus_next/backend
    env:
      DJANGO_SECRET_KEY: benchmark-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      POSTGRES_DB: admrail_benchmark
      POSTGRES_USER: admrail_benchmark
      POSTGRES_PASSWORD: benchmark_only_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      ALLOW_BENCHMARK_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus_next/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - name: Seed isolated million-entry dataset
        run: python scripts/benchmark_million_journals.py --entries 1000000 --batch-size 5000
      - name: Start HTTP server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/admrail-http.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/admrail-http.log
          exit 1
      - name: Run concurrent authenticated-user test
        run: python scripts/benchmark_concurrent_users.py
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Admrail-Concurrent-Users-Benchmark
          path: |
            nexus_next/backend/concurrent-load-test.json
            /tmp/admrail-http.log
          if-no-files-found: warn
          retention-days: 14
