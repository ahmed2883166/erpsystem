name: Admrail Concurrent Users Benchmark
on:
  push:
    branches:
      - work/nexus-django-react-rebuild
      - fix/audit-performance-and-owner-toolkit-2026-11
    paths:
      - "nexus_next/backend/scripts/benchmark_concurrent_users.py"
      - "nexus_next/backend/scripts/benchmark_posting_concurrency.py"
      - "nexus_next/backend/scripts/explain_accounting_reports.py"
      - "nexus_next/backend/config/settings.py"
      - "nexus_next/backend/requirements.txt"
      - "nexus_next/backend/accounting/api.py"
      - "nexus_next/backend/accounting/services.py"
      - "nexus_next/backend/accounting/tests*.py"
      - "nexus_next/backend/accounting/reconciliation.py"
      - "nexus_next/backend/sales/api.py"
      - "nexus_next/backend/sales/tests*.py"
      - "nexus_next/backend/purchasing/api.py"
      - "nexus_next/backend/purchasing/tests*.py"
      - "nexus_next/backend/treasury/api.py"
      - "nexus_next/backend/treasury/tests*.py"
      - "nexus_next/backend/inventory/api.py"
      - "nexus_next/backend/inventory/tests*.py"
      - ".github/workflows/admrail-concurrent-users.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nexus_next/backend/scripts/benchmark_concurrent_users.py"
      - "nexus_next/backend/scripts/benchmark_posting_concurrency.py"
      - "nexus_next/backend/scripts/explain_accounting_reports.py"
      - "nexus_next/backend/config/settings.py"
      - "nexus_next/backend/requirements.txt"
      - "nexus_next/backend/accounting/api.py"
      - "nexus_next/backend/accounting/services.py"
      - "nexus_next/backend/accounting/tests*.py"
      - "nexus_next/backend/accounting/reconciliation.py"
      - "nexus_next/backend/sales/api.py"
      - "nexus_next/backend/sales/tests*.py"
      - "nexus_next/backend/purchasing/api.py"
      - "nexus_next/backend/purchasing/tests*.py"
      - "nexus_next/backend/treasury/api.py"
      - "nexus_next/backend/treasury/tests*.py"
      - "nexus_next/backend/inventory/api.py"
      - "nexus_next/backend/inventory/tests*.py"
      - ".github/workflows/admrail-concurrent-users.yml"
  workflow_dispatch:
concurrency:
  group: admrail-concurrent-users-benchmark
  cancel-in-progress: true
jobs:
  concurrent-users:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: admrail_benchmark
          POSTGRES_USER: admrail_benchmark
          POSTGRES_PASSWORD: benchmark_only_password
        ports:
          - 5432:5432
        options: >-
          --shm-size=4gb
          --health-cmd "pg_isready -U admrail_benchmark -d admrail_benchmark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: nexus_next/backend
    env:
      DJANGO_SECRET_KEY: benchmark-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      POSTGRES_DB: admrail_benchmark
      POSTGRES_USER: admrail_benchmark
      POSTGRES_PASSWORD: benchmark_only_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      ALLOW_BENCHMARK_DATABASE: "1"
      # Isolated candidate profile: 16MB plus one parallel worker.
      # The application default remains 32MB / zero workers unless explicitly configured.
      ADMRAIL_REPORT_WORK_MEM: "16MB"
      ADMRAIL_REPORT_PARALLEL_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexus_next/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Tune isolated PostgreSQL WAL for the benchmark
        run: |
          python manage.py shell -c "from django.db import connection; connection.ensure_connection(); connection.set_autocommit(True); c=connection.cursor(); c.execute(\"ALTER SYSTEM SET max_wal_size = '8GB'\"); c.execute(\"ALTER SYSTEM SET checkpoint_timeout = '30min'\"); c.execute(\"ALTER SYSTEM SET checkpoint_completion_target = '0.9'\"); c.execute(\"ALTER SYSTEM SET wal_compression = 'on'\"); c.execute(\"SELECT pg_reload_conf()\"); print('PostgreSQL benchmark WAL settings applied')"
      - run: python manage.py migrate --noinput
      - name: Seed isolated million-entry dataset
        run: python scripts/benchmark_million_journals.py --entries 1000000 --batch-size 5000
      - name: Refresh PostgreSQL planner statistics
        run: |
          python manage.py shell -c "from django.db import connection; c=connection.cursor(); c.execute(\"ANALYZE accounting_journalentry\"); c.execute(\"ANALYZE accounting_journalline\"); c.execute(\"ANALYZE accounting_chartofaccount\"); print(\"ANALYZE completed\")"
      - name: Capture EXPLAIN ANALYZE plans for trial balance and general ledger
        run: python scripts/explain_accounting_reports.py
      - name: Start production-like Windows-compatible WSGI server
        run: |
          waitress-serve --listen=127.0.0.1:8000 --threads=32 config.wsgi:application > /tmp/admrail-http.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/admrail-http.log
          exit 1
      - name: Run concurrent authenticated-user read test
        run: python scripts/benchmark_concurrent_users.py
      - name: Run concurrent journal creation and posting test
        run: python scripts/benchmark_posting_concurrency.py
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Admrail-Concurrent-Users-Benchmark
          path: |
            nexus_next/backend/concurrent-load-test.json
            nexus_next/backend/concurrent-posting-load-test.json
            nexus_next/backend/accounting-report-explain.json
            /tmp/admrail-http.log
          if-no-files-found: warn
          retention-days: 14
