{% extends "base.html" %}{% block title %}تعديل عميل{% endblock %}{% block content %}<header><h2>تعديل بيانات العميل</h2><a class="btn secondary" href="{{ url_for('sales.customer_list') }}">رجوع</a></header><section class="panel"><form method="post"><div class="form-grid"><label>الكود<input name="code" value="{{ customer.code }}" required></label><label>الاسم<input name="name" value="{{ customer.name }}" required></label><label>الرقم الضريبي<input name="tax_number" value="{{ customer.tax_number }}"></label><label>الهاتف<input name="phone" value="{{ customer.phone }}"></label><label>البريد<input name="email" type="email" value="{{ customer.email }}"></label><label>العنوان<input name="address" value="{{ customer.address }}"></label><label>الحد الائتماني<input name="credit_limit" type="number" min="0" step="0.01" value="{{ customer.credit_limit }}"></label><label>نوع خصم العميل<select name="discount_type"><option value="none" {% if customer.discount_type=='none' %}selected{% endif %}>بدون خصم</option><option value="percent" {% if customer.discount_type=='percent' %}selected{% endif %}>نسبة مئوية %</option><option value="fixed" {% if customer.discount_type=='fixed' %}selected{% endif %}>مبلغ مقطوع</option></select></label><label>قيمة الخصم الافتراضي<input name="discount_value" type="number" min="0" max="100" step="0.01" value="{{ customer.discount_value }}"></label></div>{% if used %}<p class="notice">هذا العميل مرتبط بفواتير سابقة؛ تعديل بياناته لا يغير الفواتير المرحلة.</p>{% endif %}<button>حفظ التعديلات</button></form></section>{% endblock %}
