{% extends "base.html" %}{% block title %}تعديل مورد{% endblock %}{% block content %}<header class="page-heading"><div><h2>تعديل بيانات المورد</h2><a class="btn secondary" href="{{ url_for('purchase.suppliers') }}">رجوع</a></div></header><section class="panel erp-party-panel"><form method="post" class="form-grid erp-master-form"><div class="form-grid"><label>كود المورد (تلقائي)<input name="code" value="{{ supplier.code }}" readonly aria-readonly="true"><small>الكود محفوظ ولا يتغير من شاشة تعديل البيانات.</small></label><label>الاسم<input name="name" value="{{ supplier.name }}" required></label><label>الرقم الضريبي<input name="tax_number" value="{{ supplier.tax_number }}"></label><label>الهاتف<input name="phone" value="{{ supplier.phone }}"></label><label>البريد<input name="email" type="email" value="{{ supplier.email }}"></label><label>العنوان<input name="address" value="{{ supplier.address }}"></label></div>{% if used %}<p class="notice">هذا المورد مرتبط بمستندات سابقة؛ يمكن تعديل بيانات التعريف دون حذف المستندات.</p>{% endif %}<button>حفظ التعديلات</button></form></section>{% endblock %}
