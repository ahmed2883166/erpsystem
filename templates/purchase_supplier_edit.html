{% extends "base.html" %}{% block title %}تعديل مورد{% endblock %}{% block content %}<header><h2>تعديل بيانات المورد</h2><a class="btn secondary" href="{{ url_for('purchase.suppliers') }}">رجوع</a></header><section class="panel"><form method="post"><div class="form-grid"><label>الكود<input name="code" value="{{ supplier.code }}" required></label><label>الاسم<input name="name" value="{{ supplier.name }}" required></label><label>الرقم الضريبي<input name="tax_number" value="{{ supplier.tax_number }}"></label><label>الهاتف<input name="phone" value="{{ supplier.phone }}"></label><label>البريد<input name="email" type="email" value="{{ supplier.email }}"></label><label>العنوان<input name="address" value="{{ supplier.address }}"></label></div>{% if used %}<p class="notice">هذا المورد مرتبط بمستندات سابقة؛ يمكن تعديل بيانات التعريف دون حذف المستندات.</p>{% endif %}<button>حفظ التعديلات</button></form></section>{% endblock %}
