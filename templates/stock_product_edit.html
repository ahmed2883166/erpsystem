{% extends "base.html" %}{% block title %}تعديل صنف{% endblock %}{% block content %}<header><h2>تعديل الصنف {{ product.sku }}</h2><a class="btn secondary" href="{{ url_for('stock.products') }}">رجوع</a></header><section class="panel"><form method="post"><label>كود الصنف<input name="sku" value="{{ product.sku }}" required></label><label>اسم الصنف<input name="name_ar" value="{{ product.name_ar }}" required></label><label>التصنيف<input name="category" value="{{ product.category }}"></label><label>النوع<select name="product_type">{% for v in ['goods','raw','finished','supplies','spare','service'] %}<option value="{{ v }}" {% if product.product_type==v %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></label><label>الوحدة<input name="uom" value="{{ product.uom }}" required></label><label>الباركود<input name="barcode" value="{{ product.barcode or '' }}"></label><label>الحد الأدنى<input name="min_qty" type="number" min="0" step="0.0001" value="{{ product.min_qty }}"></label><label class="checkline"><input type="checkbox" name="track_lot" {% if product.track_lot %}checked{% endif %}> تتبع التشغيلة</label><label class="checkline"><input type="checkbox" name="track_expiry" {% if product.track_expiry %}checked{% endif %}> تتبع الصلاحية</label>{% if used %}<p class="notice">هذا الصنف له حركات سابقة؛ التعديل يغير بيانات التعريف فقط ولا يعيد كتابة الحركات.</p>{% endif %}<button>حفظ التعديلات</button></form></section>{% endblock %}
