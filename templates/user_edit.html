{% extends 'base.html' %}
{% block title %}تعديل مستخدم{% endblock %}
{% block content %}
<header><h2>تعديل المستخدم {{ user.username }}</h2><a class="btn secondary" href="{{ url_for('users') }}">رجوع</a></header>
<section class="panel">
<form method="post">
<label>اسم المستخدم<input name="username" value="{{ user.username }}" required></label>
<label>الاسم الكامل<input name="full_name" value="{{ user.full_name }}" required></label>
<label>الدور الأساسي<select name="role">{% for role in roles %}<option value="{{ role }}" {% if user.role==role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label>
<label class="checkline"><input type="checkbox" name="active" value="yes" {% if user.active %}checked{% endif %}> المستخدم نشط</label>
<h3>الصلاحيات الفعلية</h3><p class="muted">الصلاحيات المحددة هنا هي التي ستُطبق على هذا المستخدم بعد تسجيل الدخول التالي.</p>
<div class="permission-grid">
{% for permission in all_permissions %}<label class="permission-option"><input type="checkbox" name="permissions" value="{{ permission }}" {% if permission in selected_permissions %}checked{% endif %}><span>{{ permission_labels[permission] }}</span></label>{% endfor %}
</div>
<label>سبب التعديل (اختياري)<textarea name="change_reason" maxlength="1000" rows="2" placeholder="سبب تعديل بيانات المستخدم أو صلاحياته"></textarea></label>
<button type="submit">حفظ التعديلات والصلاحيات</button>
</form></section>
{% endblock %}
