{% extends 'base.html' %}{% block title %}تعديل مستخدم{% endblock %}{% block content %}<header><h2>تعديل المستخدم {{ user.username }}</h2><a class="btn secondary" href="{{ url_for('users') }}">رجوع</a></header><section class="panel"><form method="post"><label>اسم المستخدم<input name="username" value="{{ user.username }}" required></label><label>الاسم الكامل<input name="full_name" value="{{ user.full_name }}" required></label><label>الدور<select name="role">{% for role in roles %}<option value="{{ role }}" {% if user.role==role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label><label class="checkline"><input type="checkbox" name="active" value="yes" {% if user.active %}checked{% endif %}> المستخدم نشط</label><button>حفظ التعديلات</button></form></section>{% endblock %}
