{% extends "base.html" %}{% block title %}تعديل أمر شراء{% endblock %}{% block content %}<header><h2>تعديل أمر الشراء {{ order.po_no }}</h2><a class="btn secondary" href="{{ url_for('purchase.index') }}">رجوع</a></header><section class="panel"><form method="post"><label>المورد<select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}" {% if s.id==order.supplier_id %}selected{% endif %}>{{ s.code }} - {{ s.name }}</option>{% endfor %}</select></label><label>الصنف<select name="product_id" id="poEditProduct" required>{% for p in products %}<option value="{{ p.id }}" data-purchase-price="{{ p.purchase_price or '0' }}" {% if p.id==order.product_id %}selected{% endif %}>{{ p.sku }} - {{ p.name_ar }}</option>{% endfor %}</select></label><label>تاريخ الأمر<input type="date" name="order_date" value="{{ order.order_date }}" required></label><label>التاريخ المتوقع<input type="date" name="expected_date" value="{{ order.expected_date or '' }}"></label><label>وحدة الشراء<select name="uom_id" id="poEditUom" required>{% for p in products %}{% for u in product_uoms[p.id] %}{% if u.purchase_enabled %}<option value="{{ u.id }}" data-product="{{ p.id }}" data-factor="{{ u.factor_to_base }}" {% if p.id==order.product_id and (u.id==order.uom_id or (not order.uom_id and u.is_base)) %}selected{% endif %}>{{ p.name_ar }} — {{ u.name_ar }}</option>{% endif %}{% endfor %}{% endfor %}</select></label><label>الكمية بوحدة الشراء<input type="number" name="quantity" min="0.0001" step="0.0001" value="{{ order.entered_quantity or order.quantity }}" required></label><label>سعر الوحدة<input type="number" id="poEditUnitPrice" name="unit_price" min="0" step="0.01" value="{{ order.unit_price }}" required></label><label>ملاحظات<input name="notes" value="{{ order.notes }}"></label><button>حفظ التعديلات</button></form></section><script>(function(){const p=document.getElementById('poEditProduct'),v=document.getElementById('poEditUnitPrice');if(!p||!v)return;function setPrice(){const u=document.getElementById('poEditUom');let first=null;for(const o of u.options){o.hidden=o.dataset.product!==p.value;if(!o.hidden&&!first)first=o;}if(first&&(!u.value||u.selectedOptions[0].hidden))u.value=first.value;const factor=Number(u.selectedOptions[0]&&u.selectedOptions[0].dataset.factor||1);v.value=(Number(p.options[p.selectedIndex].dataset.purchasePrice||0)*factor).toFixed(2);}p.addEventListener('change',setPrice);setPrice();})();</script>{% endblock %}
