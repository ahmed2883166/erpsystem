{% extends "base.html" %}{% block title %}تعديل أمر شراء{% endblock %}{% block content %}<header><h2>تعديل أمر الشراء {{ order.po_no }}</h2><a class="btn secondary" href="{{ url_for('purchase.index') }}">رجوع</a></header><section class="panel"><form method="post"><label>المورد<select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}" {% if s.id==order.supplier_id %}selected{% endif %}>{{ s.code }} - {{ s.name }}</option>{% endfor %}</select></label><label>الصنف<select name="product_id" required>{% for p in products %}<option value="{{ p.id }}" {% if p.id==order.product_id %}selected{% endif %}>{{ p.sku }} - {{ p.name_ar }}</option>{% endfor %}</select></label><label>تاريخ الأمر<input type="date" name="order_date" value="{{ order.order_date }}" required></label><label>التاريخ المتوقع<input type="date" name="expected_date" value="{{ order.expected_date or '' }}"></label><label>الكمية<input type="number" name="quantity" min="0.0001" step="0.0001" value="{{ order.quantity }}" required></label><label>سعر الوحدة<input type="number" name="unit_price" min="0" step="0.01" value="{{ order.unit_price }}" required></label><label>ملاحظات<input name="notes" value="{{ order.notes }}"></label><button>حفظ التعديلات</button></form></section>{% endblock %}
