{% extends 'base.html' %}{% block content %}<header><h2>دليل الحسابات</h2><p><a href="{{ url_for('export_data', format='csv') }}">تصدير CSV</a> · <a href="{{ url_for('export_data', format='json') }}">تصدير JSON</a></p></header><div class="grid"><section class="panel"><h3>إضافة حساب</h3><form method="post"><label>الرمز<input name="code" required></label><label>اسم الحساب<input name="name_ar" required></label><label>النوع<select name="account_type"><option value="asset">أصل</option><option value="liability">التزام</option><option value="equity">حقوق ملكية</option><option value="revenue">إيراد</option><option value="expense">مصروف</option></select></label><button>حفظ</button></form><hr><h3>استيراد حسابات CSV</h3><form action="{{ url_for('import_accounts') }}" method="post" enctype="multipart/form-data"><input type="file" name="file" accept=".csv" required><button>استيراد</button></form></section><section class="panel"><table><tr><th>الرمز</th><th>الحساب</th><th>النوع</th></tr>{% for a in accounts %}<tr><td>{{ a.code }}</td><td>{{ a.name_ar }}</td><td>{{ a.account_type }}</td></tr>{% endfor %}</table></section></div>{% endblock %}
