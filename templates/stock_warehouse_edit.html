{% extends "base.html" %}{% block title %}تعديل مخزن{% endblock %}{% block content %}<header><h2>تعديل المخزن {{ warehouse.code }}</h2><a class="btn secondary" href="{{ url_for('stock.warehouses') }}">رجوع</a></header><section class="panel"><form method="post"><label>كود المخزن<input name="code" value="{{ warehouse.code }}" required></label><label>اسم المخزن<input name="name_ar" value="{{ warehouse.name_ar }}" required></label><label>الفرع المرتبط</label><select name="branch_id"><option value="">بدون فرع محدد</option>{% for b in branches %}<option value="{{ b.id }}" {% if warehouse.branch_id==b.id %}selected{% endif %}>{{ b.code }} - {{ b.name_ar }}</option>{% endfor %}</select><button>حفظ التعديلات</button></form><p class="muted">اسم الفرع أصبح مرتبطًا بجدول الفروع بدل الإدخال النصي الحر.</p></section>{% endblock %}
