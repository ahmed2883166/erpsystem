{% extends "base.html" %}{% block title %}تحصيل عميل | NEXUS ERP{% endblock %}{% block content %}
<header><h2>تحصيل من عميل</h2></header><section class="panel"><form method="post"><div class="form-grid"><label>الفاتورة<select name="invoice_id" required><option value="">اختر الفاتورة</option>{% for x in invoices %}<option value="{{ x.id }}">{{ x.invoice_no }} — {{ x.customer_name }} — متبقي {{ '%.2f'|format((x.total_amount|float)-(x.paid_amount|float)) }}</option>{% endfor %}</select></label><label>التاريخ<input type="date" name="receipt_date" value="{{ today }}" required></label><label>قيمة التحصيل<input type="number" name="amount" min="0.01" step="0.01" required></label><label>الصندوق / البنك<select name="cash_account_id" required><option value="">اختر الحساب</option>{% for x in cash_accounts %}<option value="{{ x.id }}">{{ x.code }} - {{ x.name_ar }}</option>{% endfor %}</select></label><label>مرجع التحصيل<input name="reference"></label></div><button>تسجيل التحصيل وترحيل القيد</button></form></section>{% endblock %}
