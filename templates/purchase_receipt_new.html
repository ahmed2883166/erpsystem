{% extends "base.html" %}{% block title %}استلام مشتريات | NEXUS ERP{% endblock %}{% block content %}<header><h2>استلام بضاعة غير مفوترة (GRNI)</h2><p>يرحل النظام المخزون مدينًا وGRNI دائنًا، ولا يسجل ضريبة من إذن الاستلام.</p></header><section class="panel"><form method="post"><div class="form-row"><div><label>المورد</label><select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div><div><label>أمر الشراء (اختياري)</label><select name="po_id"><option value="">استلام بدون أمر شراء</option>{% for o in orders %}<option value="{{ o.id }}">{{ o.po_no }} — {{ o.status }}</option>{% endfor %}</select></div><div><label>المخزن</label><select name="warehouse_id" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.code }} - {{ w.name_ar }}</option>{% endfor %}</select></div><div><label>الصنف</label><select name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} - {{ p.name_ar }}</option>{% endfor %}</select></div><div><label>الكمية</label><input name="quantity" type="number" min="0.0001" step="0.0001" required></div><div><label>تكلفة الوحدة</label><input name="unit_cost" type="number" min="0" step="0.01" required></div><div><label>تاريخ الاستلام</label><input name="receipt_date" type="date" value="{{ today }}" required></div></div><button>ترحيل الاستلام والقيد</button></form></section>{% endblock %}
