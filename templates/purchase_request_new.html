{% extends "base.html" %}
{% block title %}طلب شراء داخلي جديد | NEXUS ERP{% endblock %}
{% block content %}
<header><h2>طلب شراء داخلي جديد</h2><p>هذا الطلب لا ينشئ حركة مخزون أو قيدًا محاسبيًا. بعد الاعتماد يمكن تحويله إلى أمر شراء.</p></header>
<section class="panel">
<form method="post">
<div class="form-row">
<div><label>تاريخ الطلب</label><input type="date" name="request_date" value="{{ today }}" required></div>
<div><label>تاريخ الاحتياج</label><input type="date" name="required_date"></div>
<div><label>الإدارة / القسم</label><input name="department" maxlength="100" placeholder="مثال: الصيانة"></div>
<div><label>الصنف المطلوب</label><select name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.name_ar }}</option>{% endfor %}</select></div>
<div><label>الكمية</label><input type="number" name="quantity" min="0.0001" step="0.0001" required></div>
<div><label>سعر الوحدة التقديري</label><input type="number" name="estimated_unit_price" min="0" step="0.01" value="0"></div>
</div>
<label>الغرض / مبرر الطلب</label><textarea name="purpose" rows="3" minlength="5" required></textarea>
<div class="actions"><button type="submit">حفظ الطلب كمسودة</button><a class="button secondary" href="{{ url_for('purchase.purchase_requests') }}">رجوع</a></div>
</form>
</section>
{% endblock %}
