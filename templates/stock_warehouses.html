{% extends "base.html" %}{% block title %}المخازن | NEXUS ERP{% endblock %}{% block content %}<header><h2>المخازن والفروع</h2></header><div class="grid"><section class="panel"><h3>إضافة مخزن</h3><form method="post"><label>كود المخزن *</label><input name="code" required><label>اسم المخزن *</label><input name="name_ar" required><label>الفرع / الموقع</label><input name="branch"><button>حفظ المخزن</button></form></section><section class="panel"><h3>قائمة المخازن</h3><table><tr><th>الكود</th><th>المخزن</th><th>الفرع</th></tr>{% for w in rows %}<tr><td>{{ w.code }}</td><td>{{ w.name_ar }}</td><td>{{ w.branch }}</td></tr>{% else %}<tr><td colspan="3">لا توجد مخازن.</td></tr>{% endfor %}</table></section></div>{% endblock %}
