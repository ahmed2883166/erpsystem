{% extends "base.html" %}{% block title %}سداد مورد | NEXUS ERP{% endblock %}{% block content %}<header><h2>سداد الموردين</h2><p>يُوزع السداد آليًا على أقدم فواتير المورد المفتوحة. لا تُسجل دفعة مقدمة تلقائيًا.</p></header><section class="panel"><form method="post"><div class="form-row"><div><label>المورد</label><select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div><div><label>حساب الصندوق/البنك</label><select name="cash_account_id" required>{% for a in cash_accounts %}<option value="{{ a.id }}">{{ a.code }} - {{ a.name_ar }}</option>{% endfor %}</select></div><div><label>تاريخ السداد</label><input name="payment_date" type="date" value="{{ today }}" required></div><div><label>المبلغ</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>مرجع التحويل/الشيك</label><input name="reference"></div></div><button>ترحيل السداد</button></form></section>{% endblock %}
