{% extends "base.html" %}{% block title %}أمر شراء | NEXUS ERP<script>(function(){const p=document.getElementById('poProduct'),v=document.getElementById('poUnitPrice');function setPrice(){if(v.dataset.manual==='1')return;v.value=p.options[p.selectedIndex].dataset.purchasePrice||'0';}p.addEventListener('change',setPrice);v.addEventListener('input',()=>v.dataset.manual='1');setPrice();})();</script>{% endblock %}{% block content %}<header><h2>إنشاء أمر شراء</h2></header><section class="panel"><form method="post"><div class="form-row"><div><label>المورد</label><select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>{% endfor %}</select></div><div><label>الصنف</label><select name="product_id" id="poProduct" required>{% for p in products %}<option value="{{ p.id }}" data-purchase-price="{{p.purchase_price or '0'}}">{{ p.sku }} - {{ p.name_ar }}</option>{% endfor %}</select></div><div><label>الكمية</label><input name="quantity" type="number" min="0.0001" step="0.0001" required></div><div><label>سعر الوحدة</label><input name="unit_price" id="poUnitPrice" type="number" min="0" step="0.01" required></div><div><label>تاريخ الأمر</label><input name="order_date" type="date" value="{{ today }}" required></div><div><label>التاريخ المتوقع</label><input name="expected_date" type="date"></div></div><label>ملاحظات</label><input name="notes"><button>حفظ أمر الشراء</button></form></section>{% endblock %}
