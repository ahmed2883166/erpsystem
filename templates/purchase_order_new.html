{% extends "base.html" %}{% block title %}أمر شراء | NEXUS ERP{% endblock %}{% block content %}<header><h2>إنشاء أمر شراء</h2></header><section class="panel"><form method="post"><div class="form-row"><div><label>المورد</label><select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>{% endfor %}</select></div><div><label>الصنف</label><select name="product_id" id="poProduct" required>{% for p in products %}<option value="{{ p.id }}" data-purchase-price="{{p.purchase_price or '0'}}">{{ p.sku }} - {{ p.name_ar }}</option>{% endfor %}</select></div><div><label>وحدة الشراء</label><select name="uom_id" id="poUom">{% for p in products %}{% if product_uoms[p.id] %}{% for u in product_uoms[p.id] %}{% if u.purchase_enabled %}<option value="{{ u.id }}" data-product="{{ p.id }}" data-factor="{{ u.factor_to_base }}" {% if u.is_base %}selected{% endif %}>{{ p.name_ar }} — {{ u.name_ar }}</option>{% endif %}{% endfor %}{% else %}<option value="" data-product="{{ p.id }}" data-factor="1">{{ p.name_ar }} — {{ p.uom }} (وحدة قديمة)</option>{% endif %}{% endfor %}</select></div><div><label>الكمية بوحدة الشراء</label><input name="quantity" type="number" min="0.0001" step="0.0001" required></div><div><label>سعر الوحدة</label><input name="unit_price" id="poUnitPrice" type="number" min="0" step="0.01" required></div><div><label>تاريخ الأمر</label><input name="order_date" type="date" value="{{ today }}" required></div><div><label>التاريخ المتوقع</label><input name="expected_date" type="date"></div></div><label>ملاحظات</label><input name="notes"><button>حفظ أمر الشراء</button></form></section><script>(function(){const p=document.getElementById('poProduct'),v=document.getElementById('poUnitPrice');function setPrice(){const u=document.getElementById('poUom');let first=null;for(const o of u.options){o.hidden=o.dataset.product!==p.value;if(!o.hidden&&!first)first=o;}if(first)u.value=first.value;const factor=Number(first&&first.dataset.factor||1);v.value=(Number(p.options[p.selectedIndex].dataset.purchasePrice||0)*factor).toFixed(2);}p.addEventListener('change',setPrice);document.getElementById('poUom').addEventListener('change',setPrice);setPrice();})();</script>{% endblock %}
